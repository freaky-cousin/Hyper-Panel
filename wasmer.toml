[package]
name = "firexpanel-web"
version = "1.0.0"
description = "FirexPanel Admin Console"

[dependencies]
"wasmer/static-web-server" = "^1"

[fs]
"/public" = "."

[[command]]
name = "script"
module = "wasmer/static-web-server:webserver"
runner = "wasi"

[command.annotations.wasi]
main-args = ["--root", "/public", "--port", "8080"]
